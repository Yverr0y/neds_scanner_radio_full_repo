<header class="scanner-header sticky top-0 z-50" style="padding-top: env(safe-area-inset-top);">
  <div class="scanner-header-inner">
    <div class="flex min-h-18 items-center justify-between gap-3 py-3 md:py-2">
      <div class="flex min-w-0 items-center gap-4">
        <a href="/scanner/" class="scanner-brand group">
          <img
            src="/scanner/static/icons/icon-192x192-v2.png"
            alt="Ned's Scanner Network"
            class="scanner-brand-mark"
          >
          <div class="min-w-0">
            <div class="scanner-brand-kicker">Live Dispatch</div>
            <div class="scanner-brand-name">Ned's Scanner Network</div>
            <div class="scanner-brand-meta">Live feeds, archive, analytics, and review tools in one place</div>
            {% if show_listener_count %}
            <div class="scanner-live-inline min-[1100px]:hidden" title="Live listeners">
              <span class="scanner-live-dot"></span>
              <span data-listener-count>--</span>
            </div>
            {% endif %}
          </div>
        </a>

        <nav class="hidden min-[1100px]:flex items-center gap-1 text-sm font-medium">
          <a href="/scanner/" class="scanner-nav-link {{ 'scanner-nav-link-active' if active_page == 'home' else '' }}">Home</a>
          <a href="/scanner/archive" class="scanner-nav-link {{ 'scanner-nav-link-active' if active_page == 'archive' else '' }}">Archive</a>
          <a href="/scanner/stats" class="scanner-nav-link {{ 'scanner-nav-link-active' if active_page == 'stats' else '' }}">Stats</a>
          <a href="/scanner/heatmap" class="scanner-nav-link {{ 'scanner-nav-link-active' if active_page == 'heatmap' else '' }}">Heat Map</a>
          <a href="/scanner/training" class="scanner-nav-link {{ 'scanner-nav-link-active' if active_page == 'training' else '' }}">Training</a>
          <a href="/scanner/review" class="scanner-nav-link {{ 'scanner-nav-link-active' if active_page == 'review' else '' }}">Review</a>
          <button type="button" data-ask-ned-open class="scanner-nav-link scanner-nav-link-chat">
            <span class="scanner-chat-pip"></span>
            Chat
          </button>
        </nav>
      </div>

      <div class="relative flex items-center gap-2">
        {% if show_listener_count %}
        <div class="scanner-live-badge hidden min-[1100px]:inline-flex" title="Live listeners">
          <span class="scanner-live-dot"></span>
          <span data-listener-count>--</span>
        </div>
        {% endif %}

        <button id="install-btn"
          class="scanner-icon-button scanner-install-button hidden">
          <span class="hidden sm:inline">Install App</span>
          <span class="sm:hidden">Install</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16" />
          </svg>
        </button>

        <button id="notif-settings-btn"
          class="scanner-icon-button scanner-desktop-notif text-sm"
          type="button"
          data-notification-control
          aria-label="Open scanner alert settings"
          title="Scanner alert settings">
          <span aria-hidden="true">🔔</span>
          <span>Alerts</span>
          <span class="notification-control-status" data-notification-status>Off</span>
        </button>

      </div>
    </div>
  </div>
</header>
